[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twinlink"
version = "0.2.0"
description = "Robot-agnostic bridge from a real robot (ROS 2 / MCAP) to a digital twin in simulation (MuJoCo, Isaac Sim)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Hannes Philip Voss", email = "mail@hannesvoss.de" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
# Core only: keeping the digital-twin state in memory is dependency-light.
dependencies = [
    "numpy>=1.21",
    "pyyaml>=5.4",
    "clearlog",
]

[project.optional-dependencies]
# Mock mode: replay recorded MCAP / rosbag2 files without a ROS install.
mcap = ["rosbags>=0.9"]
# MuJoCo simulation sink + image display.
mujoco = ["mujoco>=3.0", "opencv-python>=4.5"]
# Live mode over a foxglove_bridge WebSocket (no ROS install needed).
# websockets = the client Foxglove Studio / the official SDK use (foxglove_bridge
# rejects some other clients' handshakes).
foxglove = ["websockets>=12", "rosbags>=0.9"]
# Live mode over a native Zenoh client (robots running rmw_zenoh; no ROS needed).
# The zenoh version must match the robot's rmw_zenoh zenoh version.
zenoh = ["eclipse-zenoh>=1.0", "rosbags>=0.9"]
# ManiSkill evaluation world (workstation only).  ``pin`` brings coal, the collision backend, and is the
# kinematics/geometry oracle -- NOT mujoco: nothing on this route needs it, because Pinocchio reads the same SRDF
# move_group loads and its disabled-pair set therefore agrees with the planner by construction.
# sapien is pinned to the version measured on macOS arm64 with MoltenVK; there is NO linux aarch64 wheel, which is
# why this extra never gets installed in the container.
maniskill = ["sapien==3.0.3", "mani_skill==3.0.1", "pin>=4.1,<5"]
# Live mode (rclpy) is provided by your ROS 2 distribution, not pip.
all = [
    "rosbags>=0.9", "mujoco>=3.0", "opencv-python>=4.5", "websockets>=12", "eclipse-zenoh>=1.0",
    "sapien==3.0.3", "mani_skill==3.0.1", "pin>=4.1,<5",
]

[project.urls]
Homepage = "https://github.com/CLAIRLab-HAW/twinlink"
Issues = "https://github.com/CLAIRLab-HAW/twinlink/issues"

[tool.uv.sources]
clearlog = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Black ran until 2026-08-26 (no formatter before 2026-08-24); ruff format is byte-compatible enough that the
# 2026-08-30 switch is the one reflow commit, not a rewrite (198 files workspace-wide).
line-length = 120
extend-exclude = [".venv", ".superpowers", ".idea", "urdf", "data", "node_modules", "build", "dist", "*.egg-info"]
respect-gitignore = false

[tool.ruff.lint]
# The durable lint scope of this workspace, measured against the 2026-08-30 stock (ruff@0.16.5): deliberately out
# are T20 (168 print hits in legitimate CLIs/scripts), N (197 hits, all existing convention rather than bugs) as
# well as TD/FIX (demands TODO author and link -- R-numbers take that role here) and FLY (0 hits).
select = ["E4", "E7", "E9", "E501", "F", "I", "UP", "B", "D100"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["E402", "E702"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
