# CI: pytest + ruff (hard errors only). Standalone; the urdf/mujoco smoke test skips without a workspace.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: libs/twinlink

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install numpy pyyaml pytest ruff
      - run: cd libs/twinlink && ruff check .
      - run: cd libs/twinlink && ruff format --check .
      - run: cd libs/twinlink && python -m pytest -q
